[package]
name = "smmu"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ARM SMMU v3 (System Memory Management Unit) implementation - Production-grade translation engine"
keywords = ["smmu", "iommu", "memory-management", "arm", "translation"]
categories = ["embedded", "hardware-support", "no-std"]
readme = "../README.md"

[lib]
name = "smmu"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Minimal dependencies - stdlib only for maximum safety and auditability
# Error handling with thiserror for custom error types
thiserror = "2.0"
# Stack-based small vector optimization for batched operations
smallvec = "1.11"
# Lock-free concurrent hash map for PASID management
dashmap = "5.5"
# Optional serialization support
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
# Testing and benchmarking dependencies only
criterion = "0.5"
# Serialization for testing and debugging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Property-based testing for finding edge cases
proptest = "1.5"
# Concurrency testing for finding race conditions
loom = "0.7"
# Fast randomness for fuzzing tests
rand = "0.8"
# Testing utilities
quickcheck = "1.0"
quickcheck_macros = "1.0"

[lints]
workspace = true

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
# Future feature flags for optional functionality
# pasid = []
# two-stage = []
# cache = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "translation"
harness = false

[[bench]]
name = "address_space"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "algorithm_optimization"
harness = false

[[bench]]
name = "memory_usage"
harness = false

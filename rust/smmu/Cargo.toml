[package]
name = "smmu"
version = "1.6.5"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ARM SMMU v3 (System Memory Management Unit) implementation - Production-grade translation engine"
keywords = ["smmu", "iommu", "memory-management", "arm", "virtualization"]
categories = ["embedded", "hardware-support", "simulation"]
readme = "../README.md"
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "../README.md",
]

[lib]
name = "smmu"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Minimal dependencies - stdlib only for maximum safety and auditability
# Error handling with thiserror for custom error types
thiserror = "2.0"
# Stack-based small vector optimization for batched operations
smallvec = "1.11"
# Lock-free concurrent hash map for PASID management
dashmap = "5.5"
# Optional serialization support
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
# Testing and benchmarking dependencies only
criterion = "0.5"
# Serialization for testing and debugging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Property-based testing for finding edge cases
proptest = "1.5"
# Concurrency testing for finding race conditions
loom = "0.7"
# Fast randomness for fuzzing tests
rand = "0.8"
# Testing utilities
quickcheck = "1.0"
quickcheck_macros = "1.0"

[lints]
workspace = true

[features]
# Default features - standard library support with all core functionality
default = ["std", "pasid", "two-stage", "cache"]

# Standard library support (required for most use cases)
# Disable this for no_std embedded environments
std = []

# Optional serialization support via serde
# Enable this to serialize/deserialize SMMU types
serde = ["dep:serde"]

# PASID (Process Address Space ID) support
# Enable this to use multiple address spaces per stream
# Disable to reduce code size in simple single-address-space scenarios
pasid = []

# Two-stage translation support (Stage-1 → Stage-2)
# Enable this for nested/virtualized translation
# Disable if only using Stage-1 or bypass mode
two-stage = []

# TLB cache support for improved performance
# Enable this for production deployments
# Disable to reduce memory footprint in resource-constrained environments
cache = []

# Convenience feature to enable all optional functionality
full = ["std", "serde", "pasid", "two-stage", "cache"]

# Minimal feature set for embedded/resource-constrained environments
minimal = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# Document for multiple platforms to show platform-specific APIs (if any)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[[bench]]
name = "translation"
harness = false

[[bench]]
name = "address_space"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "algorithm_optimization"
harness = false

[[bench]]
name = "memory_usage"
harness = false
